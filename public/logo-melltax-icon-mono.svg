<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="24" fill="#111827"/>

  <!-- M flowing into checkmark -->
  <g transform="translate(25, 30)">
    <!-- Left part of M -->
    <path d="M 0 45 L 0 10 C 0 5 2 0 5 0 L 8 0 L 15 25 L 22 0 L 25 0 C 28 0 30 5 30 10 L 30 45"
          stroke="#FFFFFF"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Checkmark flowing from M -->
    <path d="M 32 25 L 42 35 L 62 8"
          stroke="#FFFFFF"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Subtle Thai Baht symbol -->
  <g opacity="0.2" transform="translate(82, 82)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">฿</text>
  </g>
</svg>
